name: Build Ionic Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Get the source code
      # ----------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. Install Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      # ----------------------------------------------------------
      # 3. Install project dependencies
      # ----------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci


      # ----------------------------------------------------------
      # 4. Create .env file from the single GitHub Secret
      # ----------------------------------------------------------
      - name: Create .env file
        run: |
          echo "${{ secrets.FIREBASE_ENV }}" > .env


      # ----------------------------------------------------------
      # 5. Build Ionic/Vue application
      # ----------------------------------------------------------
      - name: Build Ionic application
        run: npm run build


      # ----------------------------------------------------------
      # 6. Install Java 21
      # ----------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      # ----------------------------------------------------------
      # 7. Confirm Java version
      # ----------------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"


      # ----------------------------------------------------------
      # 8. Synchronize Capacitor with Android
      # ----------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android


      # ----------------------------------------------------------
      # 9. Give Gradle execution permission
      # ----------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ----------------------------------------------------------
      # 10. Check Gradle environment
      # ----------------------------------------------------------
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version


      # ----------------------------------------------------------
      # 11. Build RELEASE APK
      # ----------------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease


      # ----------------------------------------------------------
      # 12. Find generated APK
      # ----------------------------------------------------------
      - name: Find APK
        run: |
          echo "Searching for generated APK..."
          find android -type f -name "*.apk"


      # ----------------------------------------------------------
      # 13. Rename generated APK
      # ----------------------------------------------------------
      - name: Rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK file was not found."
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" Simple-Inventory-System.apk


      # ----------------------------------------------------------
      # 14. Check final APK
      # ----------------------------------------------------------
      - name: Check final APK
        run: |
          ls -lh Simple-Inventory-System.apk


      # ----------------------------------------------------------
      # 15. Upload APK to GitHub Actions
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Inventory-System-APK
          path: Simple-Inventory-System.apk
          if-no-files-found: error
          retention-days: 30


      # ----------------------------------------------------------
      # 16. Create GitHub Release
      # ----------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Simple Inventory System v${{ github.run_number }}
          files: Simple-Inventory-System.apk
          generate_release_notes: true